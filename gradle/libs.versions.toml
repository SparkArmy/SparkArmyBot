[versions]
jda-core = "6.2.0"
jda-ktx = "0.13.0"
jda-jdui = "0.2.2"
postgres = "42.7.8"
hikari = "7.0.2"
flyway = "11.20.0"
aedile = "3.0.1"
koin-bom = "4.1.1"
koin-annotations = "2.3.1"
ksp = "2.3.2"
exposed-bom = "1.0.0-rc-4"
ktor-bom = "3.3.3"
logback-classic = "1.5.23"
slf4j-api = "2.0.17"
kotlin-logging-jvm = "7.0.13"
json = "20251224"
okhttp = "5.3.2"
annotations = "26.0.2"
kotlin-bom = "2.3.0"
kotlinx-coroutines = "1.10.2"
stacktrace-decoroutinator-jvm = "2.6.0"
tomjl = "1.1.1"
jackson = "2.20.1"
twitchj4 = "1.25.0"
javacpp = "1.5.10"


[libraries]
jda-core = { module = "net.dv8tion:JDA", version.ref = "jda-core" }
jda-ktx = { module = "club.minnced:jda-ktx", version.ref = "jda-ktx" }
jda-jdui = { module = "dev.xirado:jdui-core", version.ref = "jda-jdui" }

data-postgresql = { module = "org.postgresql:postgresql", version.ref = "postgres" }
data-hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
data-flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
data-flyway-database = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
data-aedile = { module = "com.sksamuel.aedile:aedile-core", version.ref = "aedile" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }

koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin-annotations" }
koin-ksp-compiler = { module = "io.insert-koin:koin-ksp-compiler", version.ref = "koin-annotations" }

data-exposed-bom = { module = "org.jetbrains.exposed:exposed-bom", version.ref = "exposed-bom" }
data-exposed-core = { module = "org.jetbrains.exposed:exposed-core" }
data-exposed-crypt = { module = "org.jetbrains.exposed:exposed-crypt" }
data-exposed-dao = { module = "org.jetbrains.exposed:exposed-dao" }
data-exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc" }
data-exposed-json = { module = "org.jetbrains.exposed:exposed-json" }
data-exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime" }

ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor-bom" }
ktor-server-core-jvm = { module = "io.ktor:ktor-server-core-jvm" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json" }
ktor-serialization-kotlinx-xml = { module = "io.ktor:ktor-serialization-kotlinx-xml" }
ktor-client-core = { module = "io.ktor:ktor-client-core" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio" }
ktor-serialization-gson = { module = "io.ktor:ktor-serialization-gson" }

twitch4j = { module = "com.github.twitch4j:twitch4j", version.ref = "twitchj4" }
twitch4j-kotlin = { module = "com.github.twitch4j:twitch4j-kotlin", version.ref = "twitchj4" }

json = { module = "org.json:json", version.ref = "json" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback-classic" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j-api" }
kotlin-logging-jvm = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging-jvm" }

annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }

kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin-bom" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8" }

kotlinx-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }

stacktrace-decoroutinator-jvm = { module = "dev.reformator.stacktracedecoroutinator:stacktrace-decoroutinator-jvm", version.ref = "stacktrace-decoroutinator-jvm" }
tomlj = { module = "org.tomlj:tomlj", version.ref = "tomjl" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }


[bundles]
data-exposed = ["data-exposed-core", "data-exposed-crypt", "data-exposed-dao", "data-exposed-jdbc", "data-exposed-json", "data-exposed-kotlin-datetime"]
data-flyway = ["data-flyway-core", "data-flyway-database"]
jda = ["jda-core", "jda-jdui", "jda-ktx"]
koin = ["koin-core", "koin-annotations", "koin-ksp-compiler"]
ktor = ["ktor-client-cio", "ktor-client-core", "ktor-serialization-gson", "ktor-serialization-kotlinx-json", "ktor-serialization-kotlinx-xml", "ktor-server-content-negotiation", "ktor-server-core-jvm", "ktor-server-netty"]
twitch4j = ["twitch4j", "twitch4j-kotlin"]
logging = ["logback-classic", "slf4j-api", "kotlin-logging-jvm"]


[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor-bom" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-bom" }
javacpp = { id = "org.bytedeco.gradle-javacpp-platform", version.ref = "javacpp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-bom" }


